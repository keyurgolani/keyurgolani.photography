name: Perf A/B

# On demand only: never on push, pull request or schedule. Home's LCP and TBT, base against head, on two published
# test fixtures, with the base measured against itself in the same job for each metric's noise floor. ci/perf/ab.mjs
# says what it measures and how; ci/perf/stats.mjs holds the rule; the job summary repeats it with the numbers.
on:
  workflow_dispatch:
    inputs:
      base:
        description: Base ref (tag, branch or commit SHA, full or short). A branch or tag by its own name, not as refs/heads/... or refs/tags/....
        type: string
        required: true
        default: v1.7.0
      head:
        description: Head ref (tag, branch or commit SHA, full or short; a branch or tag by its own name, not as refs/heads/... or refs/tags/...). Empty measures the commit this run was dispatched from. Only code you'd run in CI on the dispatching branch, never a fork or a pull request ref, since it runs in that branch's cache scope.
        type: string
        required: false
        default: ''
      rounds:
        description: Rounds, 5 to 20. Each takes about 6 minutes.
        type: number
        required: true
        default: 5

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ab:
    name: Perf A/B
    # Pinned, so a run months apart measures on the same image. Not -latest.
    runs-on: ubuntu-24.04
    # Two installs and builds take about 10 minutes, and each round about 6, so this covers about 20 rounds.
    timeout-minutes: 150
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check the inputs
        env:
          ROUNDS: ${{ inputs.rounds }}
        run: |
          # 10# reads it as decimal, so 08 is 8, not a bad octal.
          if [[ ! $ROUNDS =~ ^[0-9]+$ ]] || (( 10#$ROUNDS < 5 || 10#$ROUNDS > 20 )); then
            echo "::error::rounds must be a whole number from 5 to 20, not '$ROUNDS'."
            exit 1
          fi

      # The measuring code, from the commit this run was dispatched from, so base and head are measured by the same
      # code whatever refs they are. ci/perf only, plus the root files cone mode brings. Every branch and tag, with no
      # file contents but those, so the steps after it can resolve the base and the head.
      - name: Check out the tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tool
          sparse-checkout: ci/perf
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      # actions/checkout reads a short SHA as a branch name and fails, so the base and the head go to it as the full SHA
      # of the one commit each names. A ref that names none, or more than one, stops the run here with the reason.
      - name: Resolve the base
        id: base
        env:
          BASE_INPUT: ${{ inputs.base }}
        run: |
          sha=$(bash tool/ci/perf/resolve-ref.sh tool/.git "$BASE_INPUT")
          echo "Base: $BASE_INPUT is $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Resolve the head
        id: head
        env:
          HEAD_INPUT: ${{ inputs.head || github.sha }}
        run: |
          sha=$(bash tool/ci/perf/resolve-ref.sh tool/.git "$HEAD_INPUT")
          echo "Head: $HEAD_INPUT is $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out the base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: base
          persist-credentials: false

      - name: Check out the head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.head.outputs.sha }}
          path: head
          persist-credentials: false

      # No npm cache: the job's only network is the checkouts above and npm ci below.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: head/.nvmrc

      # The image's Chrome measures both trees, so no browser is downloaded. Fail here, not an hour in.
      - name: Check the runner's Chrome
        run: google-chrome --version

      - name: Install the base
        working-directory: base
        run: npm ci

      - name: Install the head
        working-directory: head
        run: npm ci

      - name: Build both
        run: node tool/ci/perf/ab.mjs build base head

      - name: Measure
        env:
          TMPDIR: ${{ runner.temp }}
          ROUNDS: ${{ inputs.rounds }}
          BASE_REF: ${{ inputs.base }}
          HEAD_REF: ${{ inputs.head || github.ref_name }}
        run: node tool/ci/perf/ab.mjs measure --base base --head head --rounds "$ROUNDS" --out "$RUNNER_TEMP/perf-ab" --base-ref "$BASE_REF" --head-ref "$HEAD_REF"

      # Writes the table to the job summary, and fails only on a regression past a metric's noise floor.
      - name: Report
        run: node tool/ci/perf/report.mjs "$RUNNER_TEMP/perf-ab/raw.json"

      - name: Upload the raw measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-ab
          path: ${{ runner.temp }}/perf-ab/
          if-no-files-found: warn
          retention-days: 14
