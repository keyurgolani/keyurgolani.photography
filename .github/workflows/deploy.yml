name: Publish image

# Every main push runs CI, then publishes sha-<commit> to GHCR and mirrors it
# to Docker Hub. Only release.yml writes vX.Y.Z and latest. Retry a failed
# publish with "Re-run jobs".
on:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

# One publish at a time, in push order.
concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish-ghcr:
    name: Publish to GHCR
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=sha

      # Builds from the layer cache the CI image job just filled, so it gets
      # the smoke-tested layers but a digest of its own. Releases copy this
      # digest and never rebuild.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Write the job summary
        env:
          TAG: ${{ steps.meta.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published \`ghcr.io/${GITHUB_REPOSITORY,,}:$TAG\`"
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            echo "To run this build on the host, set this in its \`.env\`:"
            echo
            echo '```'
            echo "PHOTOGRAPHY_IMAGE_TAG=$TAG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  mirror:
    needs: publish-ghcr
    uses: ./.github/workflows/mirror-dockerhub.yml
    with:
      digest: ${{ needs.publish-ghcr.outputs.digest }}
      tags: ${{ needs.publish-ghcr.outputs.tag }}
    secrets: inherit
    permissions:
      contents: read
      packages: read
