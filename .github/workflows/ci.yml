name: CI

# The pull request gate. publish.yml calls this same workflow on every main
# push, so an image is only published after these jobs pass in that run.
# No paths filters: a required check that never runs blocks the merge.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# In a called workflow github.event_name is the caller's (push), so main runs
# get a group of their own and only pull requests cancel superseded runs.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check the Dockerfile matches .nvmrc
        run: |
          node_major=$(cat .nvmrc)
          if [[ ! $node_major =~ ^[0-9]+$ ]]; then
            echo "::error file=.nvmrc::.nvmrc must hold a bare Node major such as 20, not '$node_major'."
            exit 1
          fi
          if ! grep -Eq "^FROM node:${node_major}-" Dockerfile; then
            echo "::error file=Dockerfile::The Dockerfile must build FROM node:${node_major}-*, the Node major in .nvmrc."
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      # Builds, then publishes to and rolls back the standalone server on a
      # temp data root. The steps after it check that same build.
      - run: npm run test:prod
      - name: Check the build traced no project files into .next/standalone
        run: bash ci/check-standalone.sh
      - run: npm run check:prerender
      - run: npm run smoke:media

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    # The suite alone takes about 19 minutes on next, and the Playwright install
    # is bounded at three 6-minute tries.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # WebKit runs Home's first-tap cases on the mobile-webkit project. --only-shell applies to Chromium alone.
      # The apt half of --with-deps has hung for the whole job on a slow mirror
      # (#84, #87, #88). Bound each try and retry a hung one.
      - name: Install Playwright browsers
        timeout-minutes: 20
        run: |
          # A stalled package download should fail and retry in seconds, not
          # sit until the try's 6 minutes are up (#87's run stalled on fonts
          # from the Azure mirror all three tries).
          printf '%s\n' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/99ci-timeouts >/dev/null
          for try in 1 2 3; do
            timeout 360 npx playwright install --with-deps --only-shell chromium webkit && exit 0
            echo "Playwright install try $try failed or took over 6 minutes."
            # timeout stops npx, not the apt-get it started under sudo, which
            # would hold the dpkg lock. The runner is throwaway.
            sudo pkill -9 -f 'apt-get|dpkg' || true
            sudo dpkg --configure -a || true
            # Try the main Ubuntu archive instead of the runner's mirror next time.
            sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          done
          exit 1

      - run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  themes:
    name: Themes, CSS budget and Black parity
    runs-on: ubuntu-latest
    # Two builds and about 120 page pairs.
    timeout-minutes: 35
    env:
      # next before the five themes: v1.2.0 plus #119's curator copy. Black must paint as it does there. Move it only
      # for a change that isn't a theme's and moves Black on purpose, and say so in that PR.
      PARITY_BASE: c2054aa44e94f17373ec19d93fec6dcd7e3552f4
      # About's placeholder copy fails any other production build (utils/artistProfile.ts); both builds here serve tests only.
      ALLOW_PROVISIONAL_COPY: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - name: Build the head
        run: npm run build

      - name: Build the base
        run: |
          git worktree add --detach ../parity-base "$PARITY_BASE"
          cd ../parity-base
          npm ci
          npm run build

      # Each visitor route's first-load CSS, from the two builds' manifests: at most +2,500 B gzipped (R2-P2-1).
      - name: Check the CSS budget
        # A run step without a shell has no pipefail, so the budget's exit would be tee's.
        shell: bash
        run: node ci/themes-budget.mjs ../parity-base . | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install Chromium
        timeout-minutes: 15
        run: |
          printf '%s\n' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/99ci-timeouts >/dev/null
          for try in 1 2 3; do
            timeout 360 npx playwright install --with-deps --only-shell chromium && exit 0
            echo "Playwright install try $try failed or took over 6 minutes."
            sudo pkill -9 -f 'apt-get|dpkg' || true
            sudo dpkg --configure -a || true
          done
          exit 1

      - name: Black against the base, pixel for pixel
        run: PARITY_BASE_DIR="$(cd ../parity-base && pwd)" npx playwright test -c e2e/themes/parity.config.ts

      - if: always()
        run: cat test-results/parity/black-parity.md >> "$GITHUB_STEP_SUMMARY" || true

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: themes-parity
          path: test-results/parity/
          retention-days: 7

  image:
    name: Image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Check docker-compose.prod.yml
        run: ci/check-compose.sh

      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ghcr.io/keyurgolani/keyurgolani.photography:ci-smoke
          cache-from: type=gha
          # A failed cache export never fails the job. Publish to GHCR smoke
          # tests the digest it pushes, so main doesn't depend on this cache.
          cache-to: type=gha,mode=max,ignore-error=true

      # The Dockerfile pins its base by tag and digest, so a Node bump that
      # updates the tag but not the digest would still build the old Node.
      # This runs before the smoke test, so a wrong runtime fails fast.
      - name: Check the image runs the Node major in .nvmrc
        run: |
          node_major=$(cat .nvmrc)
          version=$(docker run --rm --pull never ghcr.io/keyurgolani/keyurgolani.photography:ci-smoke node --version)
          echo "The image runs Node $version."
          if [[ $version != "v${node_major}."* ]]; then
            echo "::error file=Dockerfile::The image runs Node $version, but .nvmrc says ${node_major}. Check the base image digest."
            exit 1
          fi

      - name: Smoke test the image
        run: ci/smoke-image.sh ci-smoke

      - name: Smoke test the watcher's --once mode
        env:
          IMAGE: ghcr.io/keyurgolani/keyurgolani.photography:ci-smoke
        run: bash ci/smoke-watcher-once.sh

      # ci/smoke-catalog.sh publishes its test catalog on the runner with
      # ci/publish-fixture.ts, so it needs Node and the dev dependencies.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Smoke test the catalog in the image
        run: ci/smoke-catalog.sh ci-smoke

  # Fails on a high or critical advisory in a production dependency unless
  # .github/audit-allowlist.json lists it. npm audit reads only the lockfile,
  # so the job skips npm ci.
  audit:
    name: Production audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: node ci/audit-gate.mjs

  # The one required check. always() matters: without it a failed job skips
  # this one, and GitHub counts a skipped required check as passing. The
  # ruleset requires "CI result" by name, so a rename changes the ruleset in
  # the same PR. A new job joins `needs` here and is checked automatically.
  result:
    name: CI result
    if: always()
    needs: [verify, e2e, themes, image, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          results=$(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<<"$NEEDS")
          if [ -z "$results" ]; then
            echo "::error::No job results to check."
            exit 1
          fi
          failed=0
          while read -r job result; do
            echo "$job: $result"
            if [ "$result" != success ]; then
              echo "::error::$job finished with $result."
              failed=1
            fi
          done <<<"$results"
          exit "$failed"
