version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    # No --hostname: inside the container, next dev listens on every interface,
    # and the loopback-only port below is the boundary.
    command: npx next dev
    ports:
      # Loopback only. From another machine, use an SSH tunnel to 127.0.0.1:3000.
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - ./public/assets/photos:/app/public/assets/photos # Bind mount for photos
      - ./portfolio-data:/data/portfolio:ro # The private data root, which only the watcher writes
    environment:
      - NODE_ENV=development
      - PHOTOGRAPHY_DATA_DIR=/data/portfolio
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Image optimization watcher - processes new photos automatically
  image-watcher:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    volumes:
      - .:/app
      - /app/node_modules
      - ./public/assets/photos:/app/public/assets/photos # Same volume mount as web
      - ./portfolio-data:/data/portfolio
    environment:
      - NODE_ENV=development
      - PHOTOGRAPHY_DATA_DIR=/data/portfolio
    command: npx tsx scripts/imageWatcher.ts --watch
    # The watcher doesn't need web to serve anything, so it starts alongside it.
    depends_on:
      web:
        condition: service_started
