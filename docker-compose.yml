version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    # No --hostname: inside the container, next dev listens on every interface,
    # and the loopback-only port below is the boundary.
    command: npx next dev
    ports:
      # Loopback only. From another machine, use an SSH tunnel to 127.0.0.1:3000.
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      # No photo library: web reads nothing in it (#13's slice E).
      # The private data root, which only the watcher writes. Read-only here by
      # convention only: .:/app shows the same folder read-write at /app/portfolio-data.
      - ./portfolio-data:/data/portfolio:ro
    environment:
      - NODE_ENV=development
      - PHOTOGRAPHY_DATA_DIR=/data/portfolio
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Image watcher - gives each new photo its ID and builds its /media set
  image-watcher:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    volumes:
      - .:/app
      - /app/node_modules
      # The photo library, read-only, at the path production mounts it. Read-only
      # by convention only here too: .:/app shows it read-write under /app/public.
      - ./public/assets/photos:/data/library:ro
      - ./portfolio-data:/data/portfolio
    environment:
      - NODE_ENV=development
      - PHOTOGRAPHY_DATA_DIR=/data/portfolio
      - PHOTOGRAPHY_LIBRARY_DIR=/data/library
    command: npx tsx scripts/imageWatcher.ts --watch
    # The watcher doesn't need web to serve anything, so it starts alongside it.
    depends_on:
      web:
        condition: service_started
