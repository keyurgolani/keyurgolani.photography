version: '3.8'

services:
  web:
    image: ghcr.io/keyurgolani/keyurgolani.photography:${PHOTOGRAPHY_IMAGE_TAG:?Set PHOTOGRAPHY_IMAGE_TAG to a release tag, for example v1.1.0}
    ports:
      # Loopback only. A reverse proxy or tunnel on the host serves it to the
      # internet. PHOTOGRAPHY_PORT changes the host port.
      - "127.0.0.1:${PHOTOGRAPHY_PORT:-3000}:3000"
    volumes:
      # No photo library: web reads nothing in it. Photos reach the site only
      # as the /media sets in the data root (#13's slice E).
      # The private data root: photo identity state and the /media sets. Only
      # the watcher writes it. Never created when missing either, since an
      # empty one beside a library that had photo IDs would mint new ones.
      # docs/data-root.md covers backing it up with the library.
      - type: bind
        source: ./portfolio-data
        target: /data/portfolio
        read_only: true
        bind:
          create_host_path: false
      # The site config folder: About's portrait, about/portrait.jpg (or .jpeg,
      # .png, .webp), and its optional about/portrait.json. Read-only, and
      # read per request, so swapping the file there changes About with no
      # rebuild or restart. Created empty when missing, so a host without one
      # still starts and About shows the name instead (docs/releasing.md,
      # About's portrait).
      - type: bind
        source: ./site-config
        target: /config/site
        read_only: true
        bind:
          create_host_path: true
    restart: always
    environment:
      - NODE_ENV=production
      - PHOTOGRAPHY_DATA_DIR=/data/portfolio
      - PHOTOGRAPHY_SITE_CONFIG_DIR=/config/site
      - SITE_URL=https://keyurgolani.photography  # Public origin for share links, read at runtime
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Image watcher - gives each new photo its ID and builds its /media set
  # Both containers run as uid 1001 (nextjs user). web writes nothing on the
  # host. The watcher reads the photos, read-only, and writes only the data
  # root. Since v1.7.0 it writes no legacy derivatives into the photos folder.
  # Run on host:
  #   mkdir -p ./portfolio-data
  #   chown -R 1001:1001 ./portfolio-data
  #   chmod 700 ./portfolio-data
  # and keep the photos readable to uid 1001 (docs/data-root.md, Who owns
  # the photos). Its run --rm form is also the CLI, photos.mjs, with these
  # same mounts and the same uid as web: photos purge --yes, purge --revoke
  # --yes and any gc --apply refuse as any uid but the data root's owner,
  # before they take a lock, since web must read the tombstones they write
  # (docs/data-root.md, Who owns the data root).
  image-watcher:
    image: ghcr.io/keyurgolani/keyurgolani.photography:${PHOTOGRAPHY_IMAGE_TAG:?Set PHOTOGRAPHY_IMAGE_TAG to a release tag, for example v1.1.0}
    user: "1001:1001"
    volumes:
      # The photo library, the owner's originals. Read-only: nothing in the
      # stack writes it. Never created when missing, so a lost photos folder
      # keeps the container from starting instead of reading as an empty
      # library, and PHOTOGRAPHY_LIBRARY_DIR has no default to fall back to.
      - type: bind
        source: ./public/assets/photos
        target: /data/library
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./portfolio-data
        target: /data/portfolio
        bind:
          create_host_path: false
    restart: always
    environment:
      - NODE_ENV=production
      - PHOTOGRAPHY_DATA_DIR=/data/portfolio
      - PHOTOGRAPHY_LIBRARY_DIR=/data/library
    command: ["node", "dist/scripts/imageWatcher.mjs", "--watch"]
    # Healthy while status/watcher.json in the data root is at most 120 s old
    # and no identity pass has run longer than 30 minutes. The watcher rewrites
    # it every 30 s, so a stopped event loop, a data root it can't write, or a
    # pass that never ends turns unhealthy (docs/data-root.md, Health).
    healthcheck:
      test: ["CMD", "node", "dist/scripts/watcherHealth.mjs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # The watcher doesn't need web to serve anything, so it starts alongside it.
    depends_on:
      web:
        condition: service_started

  # The curator (#14), off unless started by name. docs/curator.md has the
  # rest: who can reach it, and turning it on and off.
  #   docker compose -f docker-compose.prod.yml up -d curator
  #   docker compose -f docker-compose.prod.yml stop curator
  # The same image as web, with the curator flag on, which no other service
  # sets. By default it publishes only on the host's 127.0.0.1:3001, and from
  # another machine the way in is an SSH tunnel to that port, and then the
  # curator's passphrase login. With CURATOR_PUBLISH set in .env to the
  # host's private LAN address (LAN mode, opt-in), every device on that
  # network can reach the login, over plain http: docs/curator.md, From your
  # home network. It writes the data root, as the watcher's uid, and mounts
  # no library, on a network of its own, so no other container can reach it.
  curator:
    image: ghcr.io/keyurgolani/keyurgolani.photography:${PHOTOGRAPHY_IMAGE_TAG:?Set PHOTOGRAPHY_IMAGE_TAG to a release tag, for example v1.1.0}
    profiles: ["curator"]
    user: "1001:1001"
    ports:
      # 127.0.0.1:3001 unless .env says otherwise. CURATOR_PUBLISH may name the
      # host's private LAN address, never 0.0.0.0: the curator reads the same
      # value below and answers 503 on every path to anything but loopback or
      # a private address. CURATOR_HOST_PORT changes the host port.
      - "${CURATOR_PUBLISH:-127.0.0.1}:${CURATOR_HOST_PORT:-3001}:3000"
    networks:
      - curator
    volumes:
      - type: bind
        source: ./portfolio-data
        target: /data/portfolio
        bind:
          create_host_path: false
      # The passphrase hash and the session secret, made at deploy time
      # (docs/curator.md), owned by uid 1001 and readable by it alone. Read-only,
      # mounted into curator and no other service. Never created when missing,
      # and a missing or unusable file is a 503 on every path.
      - type: bind
        source: ./secrets
        target: /run/secrets/curator
        read_only: true
        bind:
          create_host_path: false
      # The site config folder, as web mounts it: read-only, and created empty
      # when missing, so the draft preview's About shows the same portrait as
      # the site's, or the name when there's none.
      - type: bind
        source: ./site-config
        target: /config/site
        read_only: true
        bind:
          create_host_path: true
    # On only while the owner runs it, so a reboot never brings it back.
    restart: "no"
    environment:
      - NODE_ENV=production
      - PHOTOGRAPHY_DATA_DIR=/data/portfolio
      # The library's path, which image-watcher mounts, only so the curator can
      # keep it out of its messages. The curator reads no file there, so it
      # mounts no library: its Inbox, Series and Publish screens read the
      # registry and the /media sets in the data root.
      - PHOTOGRAPHY_LIBRARY_DIR=/data/library
      - PHOTOGRAPHY_SITE_CONFIG_DIR=/config/site
      - CURATION_ENABLED=true
      # Docker's port forward reaches the container on its own interface, so
      # the server listens on every interface inside it, and the publish to
      # 127.0.0.1 above is the boundary. CURATION_BIND_SCOPE=container is what
      # lets a curator listen on 0.0.0.0, and only inside a container.
      - HOSTNAME=0.0.0.0
      - CURATION_BIND_SCOPE=container
      # Optional, from .env: one more local tunnel port the Host allowlist
      # answers to, when 3001 is taken on the owner's machine.
      - CURATOR_TUNNEL_PORT=${CURATOR_TUNNEL_PORT:-}
      # Optional, from .env, and the same values the publish above reads, so
      # the curator knows the mode it was published in: the Host allowlist
      # and the cookie follow them. CURATOR_EXTRA_HOSTS lists more name:port
      # Hosts, read in LAN mode only.
      - CURATOR_PUBLISH=${CURATOR_PUBLISH:-}
      - CURATOR_HOST_PORT=${CURATOR_HOST_PORT:-}
      - CURATOR_EXTRA_HOSTS=${CURATOR_EXTRA_HOSTS:-}
    healthcheck:
      # With the flag on, every path answers only the curator's Host.
      test: ["CMD", "wget", "-q", "--spider", "--header", "Host: localhost:3001", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  # The curator's alone. Its port publish still works, and web and the
  # watcher, on the default network, can't reach it.
  curator: {}
