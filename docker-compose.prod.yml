version: '3.8'

services:
  web:
    image: ghcr.io/keyurgolani/keyurgolani.photography:${PHOTOGRAPHY_IMAGE_TAG:?Set PHOTOGRAPHY_IMAGE_TAG to a release tag, for example v1.1.0}
    ports:
      - "3000:3000"
    volumes:
      # Never created when missing, so a lost photos folder keeps the container
      # from starting instead of serving an empty library
      - type: bind
        source: ./public/assets/photos
        target: /app/public/assets/photos
        bind:
          create_host_path: false
      - ./.next-images-cache:/app/.next/cache/images
    restart: always
    environment:
      - NODE_ENV=production
      - SITE_URL=https://keyurgolani.photography  # Public origin for share links, read at runtime
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/photos"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Image optimization watcher - processes new photos automatically
  # Note: Ensure photos directory is writable by uid 1001 (nextjs user)
  # Run on host: chown -R 1001:1001 ./public/assets/photos
  image-watcher:
    image: ghcr.io/keyurgolani/keyurgolani.photography:${PHOTOGRAPHY_IMAGE_TAG:?Set PHOTOGRAPHY_IMAGE_TAG to a release tag, for example v1.1.0}
    user: "1001:1001"
    volumes:
      - type: bind
        source: ./public/assets/photos
        target: /app/public/assets/photos
        bind:
          create_host_path: false
    restart: always
    environment:
      - NODE_ENV=production
    command: ["npx", "tsx", "scripts/imageWatcher.ts", "--watch"]
    depends_on:
      web:
        condition: service_healthy
