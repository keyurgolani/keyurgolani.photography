version: '3.8'

services:
  web:
    image: ghcr.io/keyurgolani/keyurgolani.photography:${PHOTOGRAPHY_IMAGE_TAG:?Set PHOTOGRAPHY_IMAGE_TAG to a release tag, for example v1.1.0}
    ports:
      - "3000:3000"
    volumes:
      # Never created when missing, so a lost photos folder keeps the container
      # from starting instead of serving an empty library
      - type: bind
        source: ./public/assets/photos
        target: /app/public/assets/photos
        bind:
          create_host_path: false
      # The private data root: photo identity state and the /media sets. Only
      # the watcher writes it. Never created when missing either, since an
      # empty one beside a library that had photo IDs would mint new ones.
      # docs/data-root.md covers backing it up with the library.
      - type: bind
        source: ./portfolio-data
        target: /data/portfolio
        read_only: true
        bind:
          create_host_path: false
      - ./.next-images-cache:/app/.next/cache/images
    restart: always
    environment:
      - NODE_ENV=production
      - PHOTOGRAPHY_DATA_DIR=/data/portfolio
      - NEXT_PUBLIC_CAROUSEL_INTERVAL=12000  # Carousel slide interval in ms (default: 12000)
      - NEXT_PUBLIC_UI_AUTO_HIDE_TIMEOUT=3000  # UI elements auto-hide timeout in ms (default: 3000)
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Image optimization watcher - processes new photos automatically
  # Note: Ensure the photos directory and the data root are writable by uid
  # 1001 (nextjs user). Run on host:
  #   mkdir -p ./portfolio-data
  #   chown -R 1001:1001 ./public/assets/photos ./portfolio-data
  image-watcher:
    image: ghcr.io/keyurgolani/keyurgolani.photography:${PHOTOGRAPHY_IMAGE_TAG:?Set PHOTOGRAPHY_IMAGE_TAG to a release tag, for example v1.1.0}
    user: "1001:1001"
    volumes:
      - type: bind
        source: ./public/assets/photos
        target: /app/public/assets/photos
        bind:
          create_host_path: false
      - type: bind
        source: ./portfolio-data
        target: /data/portfolio
        bind:
          create_host_path: false
    restart: always
    environment:
      - NODE_ENV=production
      - PHOTOGRAPHY_DATA_DIR=/data/portfolio
    command: ["node", "dist/scripts/imageWatcher.mjs", "--watch"]
    # Healthy while status/watcher.json in the data root is at most 120 s old.
    # The watcher rewrites it every 30 s, so a stuck watcher, or a data root it
    # can't write, turns unhealthy.
    healthcheck:
      test: ["CMD", "node", "dist/scripts/watcherHealth.mjs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # The watcher doesn't need web to serve anything, so it starts alongside it.
    depends_on:
      web:
        condition: service_started
